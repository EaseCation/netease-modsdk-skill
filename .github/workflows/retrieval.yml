name: ModSDK retrieval regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      wiki_ref:
        description: '验证的 Wiki 分支或标签；普通发布使用 main'
        required: false
        default: main
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODSDK_WIKI_ROOT: ${{ github.workspace }}/.data/wiki
      MODSDK_WIKI_REF: ${{ github.event.inputs.wiki_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse Wiki snapshot
        run: python3 scripts/setup.py
      - name: Run frozen retrieval bank
        run: python3 scripts/evaluate.py
      - name: Run market capability regressions
        run: python3 scripts/evaluate.py --market
      - name: Check request contracts
        run: python3 scripts/evaluate.py --requests
      - name: Check guidance sources and reading budgets
        run: python3 scripts/evaluate.py --guides
      - name: Check source and session operations
        run: python3 scripts/evaluate.py --operations
      - name: Keep current regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: |
            .local/request-contract-report.json
            .local/regression-report.json
            .local/guidance-report.json
            .local/operations-report.json
            .local/market-report.json
            .local/market-expansion-report.json
          retention-days: 14
